
name: Build NumWorks Linux Simulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Epsilon
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            pkg-config libx11-dev libxext-dev \
            libfreetype-dev libpng-dev libjpeg-dev

      - name: Inspect project build instructions
        run: |
          git log -1 --oneline
          ls -la
          find . -maxdepth 3 \
            \( -name Makefile -o -name CMakeLists.txt \) \
            -print | head -100
