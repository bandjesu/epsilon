name: Build Epsilon Linux Simulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            git \
            python3 \
            python3-pip \
            python3-venv \
            nodejs \
            npm \
            pkg-config

      - name: Set up Epsilon SDK
        run: |
          chmod +x tools/setup.sh
          bash tools/setup.sh

      - name: Build simulator
        shell: bash
        run: |
          make SHELL=/bin/bash PLATFORM=simulator

      - name: List build outputs
        if: always()
        run: |
          find . -type f \( -name 'epsilon.elf' -o -name '*.app' \) \
            -print | head -100

      - name: Upload simulator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-linux-simulator
          path: |
            epsilon/build/simulator/
            epsilon/output/release/simulator/
            build/simulator/
          if-no-files-found: warn
          retention-days: 7
