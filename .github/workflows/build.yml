name: Build Epsilon Linux Simulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            git \
            python3 \
            python3-pip \
            python3-venv \
            nodejs \
            npm \
            pkg-config

      - name: Set up Epsilon SDK
        run: |
          chmod +x tools/setup.sh
          bash tools/setup.sh

      - name: Build simulator
        shell: bash
        run: |
          make SHELL=/bin/bash PLATFORM=simulator

     
      - name: Locate build outputs
        if: always()
        run: |
          echo "Searching for executable files..."
          find . -type f -executable \
            -not -path './.git/*' \
            -print | head -200

          echo "Searching for common build outputs..."
          find . -type f \
            \( -name '*.elf' -o -name '*.bin' \
               -o -name '*.app' -o -name '*.so' \
               -o -name '*.wasm' \) \
            -not -path './.git/*' \
            -print | head -200

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-build-diagnostics
          path: |
            **/*.elf
            **/*.bin
            **/*.app
            **/*.so
            **/*.wasm
          if-no-files-found: warn
          retention-days: 7
