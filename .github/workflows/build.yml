name: Build Epsilon Linux Simulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            git \
            python3 \
            python3-pip \
            python3-venv \
            nodejs \
            npm \
            pkg-config

      - name: Set up Epsilon SDK
        run: |
          chmod +x tools/setup.sh
          bash tools/setup.sh

      - name: Build simulator
        shell: bash
        run: |
          set -euo pipefail
          make SHELL=/bin/bash PLATFORM=simulator epsilon_run

      - name: Locate simulator outputs
        if: always()
        shell: bash
        run: |
          find . -type f \
            \( -name 'epsilon.bin' -o -name 'epsilon.elf' \
               -o -name 'epsilon_run' \) \
            -not -path './.git/*' -print

      - name: Upload simulator outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-simulator-build
          path: |
            output/release/simulator/
            epsilon/output/release/simulator/
            epsilon/epsilon.elf
            epsilon/epsilon.bin
          if-no-files-found: error
          retention-days: 7
